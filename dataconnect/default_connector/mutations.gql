# ==========================================
# User Mutations
# ==========================================

# Create a new user profile on sign-up.
mutation CreateUser($username: String!, $email: String!, $passwordHash: String!, $now: Timestamp!) {
  user_insert(data: {
    username: $username,
    email: $email,
    passwordHash: $passwordHash,
    createdAt: $now
  })
}

# ==========================================
# Message Mutations
# ==========================================

# Send a message in a chat room.
mutation SendMessage(
  $chatId: UUID!,
  $senderId: UUID!,
  $receiverId: UUID!,
  $content: String!,
  $messageType: String!,
  $now: Timestamp!
) {
  message_insert(data: {
    chatId: $chatId,
    senderId: $senderId,
    receiverId: $receiverId,
    content: $content,
    messageType: $messageType,
    status: "SENT",
    createdAt: $now
  })
}

# ==========================================
# Chat Mutations
# ==========================================

# Step 1 — create the chat row. Returns the new chat's UUID.
mutation CreateChat($now: Timestamp!) {
  chat_insert(data: {
    isGroup: false,
    createdAt: $now
  })
}

# Step 2 — add both participants after the chat is created.
mutation AddChatParticipants(
  $chatId: UUID!,
  $userAId: UUID!,
  $userBId: UUID!,
  $now: Timestamp!
) @transaction {
  participantA: chatParticipant_insert(data: {
    chatId: $chatId,
    userId: $userAId,
    unreadCount: 0,
    joinedAt: $now
  })
  participantB: chatParticipant_insert(data: {
    chatId: $chatId,
    userId: $userBId,
    unreadCount: 0,
    joinedAt: $now
  })
}

# ==========================================
# Presence Mutations
# ==========================================

# Update a user's last online timestamp.
mutation UpdateLastSeen($userId: UUID!, $now: Timestamp!) {
  user_update(
    id: $userId,
    data: { lastOnlineAt: $now }
  )
}