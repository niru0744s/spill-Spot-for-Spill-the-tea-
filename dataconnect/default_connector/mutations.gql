# ==========================================
# User Mutations
# ==========================================

# Create a new user profile on sign-up.
mutation CreateUser(
  $username: String!,
  $name: String!,
  $email: String!,
  $passwordHash: String!,
  $now: Timestamp!
) @auth(level: USER) {
  user_insert(data: {
    username: $username,
    name: $name,
    email: $email,
    passwordHash: $passwordHash,
    createdAt: $now
  })
}

# ==========================================
# Message Mutations
# ==========================================

# Send a message in a chat room.
mutation SendMessage(
  $chatId: UUID!,
  $senderId: UUID!,
  $receiverId: UUID,
  $content: String!,
  $messageType: String!,
  $now: Timestamp!
) @auth(level: USER) {
  message_insert(data: {
    chatId: $chatId,
    senderId: $senderId,
    receiverId: $receiverId,
    content: $content,
    messageType: $messageType,
    status: "SENT",
    createdAt: $now
  })
}

# ==========================================
# Chat Mutations
# ==========================================

# Step 1 — create the chat row. Returns the new chat's UUID.
mutation CreateChat($now: Timestamp!) @auth(level: USER) {
  chat_insert(data: {
    isGroup: false,
    createdAt: $now
  })
}

# Step 2 — add both participants after the chat is created.
mutation AddChatParticipants(
  $chatId: UUID!,
  $userAId: UUID!,
  $userBId: UUID!,
  $now: Timestamp!
) @transaction @auth(level: USER) {
  participantA: chatParticipant_insert(data: {
    chatId: $chatId,
    userId: $userAId,
    unreadCount: 0,
    joinedAt: $now
  })
  participantB: chatParticipant_insert(data: {
    chatId: $chatId,
    userId: $userBId,
    unreadCount: 0,
    joinedAt: $now
  })
}

# Create a new group chat. Returns the new chat's UUID.
mutation CreateGroupChat(
  $groupName: String!,
  $groupImageUrl: String,
  $groupDescription: String,
  $now: Timestamp!
) @auth(level: USER) {
  chat_insert(data: {
    isGroup: true,
    groupName: $groupName,
    groupImageUrl: $groupImageUrl,
    groupDescription: $groupDescription,
    createdAt: $now
  })
}

# Add a participant to a group chat.
mutation AddGroupParticipant(
  $chatId: UUID!,
  $userId: UUID!,
  $isAdmin: Boolean!,
  $now: Timestamp!
) @auth(level: USER) {
  chatParticipant_insert(data: {
    chatId: $chatId,
    userId: $userId,
    unreadCount: 0,
    joinedAt: $now,
    isAdmin: $isAdmin,
    status: "ACTIVE"
  })
}

# Update a group participant's status or role (e.g. promote/demote or remove).
mutation UpdateGroupParticipant(
  $chatId: UUID!,
  $userId: UUID!,
  $isAdmin: Boolean,
  $status: String
) @auth(level: USER) {
  chatParticipant_update(
    key: { chatId: $chatId, userId: $userId },
    data: {
      isAdmin: $isAdmin,
      status: $status
    }
  )
}

# Delete a participant record completely (e.g. when a user clears/deletes group history).
mutation RemoveGroupParticipant(
  $chatId: UUID!,
  $userId: UUID!
) @auth(level: USER) {
  chatParticipant_delete(key: {
    chatId: $chatId,
    userId: $userId
  })
}

# Update group chat metadata.
mutation UpdateGroupMetadata(
  $chatId: UUID!,
  $groupName: String,
  $groupImageUrl: String,
  $groupDescription: String
) @auth(level: USER) {
  chat_update(
    id: $chatId,
    data: {
      groupName: $groupName,
      groupImageUrl: $groupImageUrl,
      groupDescription: $groupDescription
    }
  )
}

# ==========================================
# Presence Mutations
# ==========================================

# Update a user's last online timestamp.
mutation UpdateLastSeen($userId: UUID!, $now: Timestamp!) @auth(level: USER) {
  user_update(
    id: $userId,
    data: { lastOnlineAt: $now }
  )
}