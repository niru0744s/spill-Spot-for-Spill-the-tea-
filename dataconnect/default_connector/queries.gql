# ==========================================
# Chat Queries
# ==========================================

# Fetch the inbox — all chats the signed-in user is a participant of.
query GetMyChats @auth(level: USER) {
  chatParticipants(where: { user: { id: { eq_expr: "auth.uid" } } }) {
    chat {
      id
      isGroup
      lastMessageText
      lastMessageAt
    }
    unreadCount
  }
}

# Check if a 1:1 chat already exists between the current user and another user.
# Returns the chat if found — call CreateOneToOneChat only if this returns empty.
query FindExistingChat($otherUserId: UUID!) @auth(level: USER) {
  chatParticipants(
    where: {
      _and: [
        { user: { id: { eq_expr: "auth.uid" } } }
        { chat: { isGroup: { eq: false } } }
        {
          chat: {
            chatParticipants_on_chat: {
              exist: { user: { id: { eq: $otherUserId } } }
            }
          }
        }
      ]
    }
    limit: 1
  ) {
    chat { id }
  }
}

# ==========================================
# Message Queries
# ==========================================

# Fetch the full message history for a specific chat, newest first.
query GetChatMessages($chatId: UUID!) @auth(level: USER) {
  messages(
    where: { chatId: { eq: $chatId } }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    content
    messageType
    status
    createdAt
    sender {
      id
      username
      profilePictureUrl
    }
  }
}

# ==========================================
# User Queries
# ==========================================

# Fetch a user's public profile by their UUID.
query GetUserProfile($userId: UUID!) @auth(level: USER) {
  user(id: $userId) {
    id
    username
    name
    profilePictureUrl
    bio
    lastOnlineAt
  }
}

# Search users by username substring (case-sensitive contains). Max 20 results.
# NOTE: intentionally accessible to all authenticated users — username search
# is a core social discovery feature. The warning about missing auth.uid filter
# is expected and acceptable here.
query SearchUsersByUsername($query: String!) @auth(level: USER) {
  users(
    where: { username: { contains: $query } }
    limit: 20
  ) {
    id
    username
    name
    profilePictureUrl
    bio
    lastOnlineAt
  }
}